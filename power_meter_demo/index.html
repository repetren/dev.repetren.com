<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlipperOne Power Meter</title>

<style>
  @font-face {
    font-family: "Inter";
    src: url("fonts/Inter-var.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "HaxrCorp4090";
    /* pixel font: 1 device px = 64 units, native size is 16px */
    src: url("fonts/HaxrCorp4090-FlipCTL.ttf") format("truetype");
  }
  @font-face {
    font-family: "Born2bSporty";
    /* pixel font: 1 device px = 64 units, native size is 16px */
    src: url("fonts/Born2bSportyV2-FlipCTL.ttf") format("truetype");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    font-family: "Inter", -apple-system, sans-serif;
    color: #fff;
    overflow-x: hidden;
  }

  #device {
    flex: 1;
    min-width: 0;
    position: relative;
    height: 100vh;
    overflow: hidden;
  }
  #scene {
    /* holds the frame and the screen; scaled as one unit on mobile */
    position: absolute;
    inset: 0;
    transform-origin: 0 0;
  }
  #stack {
    --frame-x: 28px;
    --frame-y: 52px;
    --frame-w: 1777px;
    position: absolute;
    /* anchored so the screen's left edge sits 150px from the window edge:
       screen renders 512px wide (256 * 2), centered on the anchor */
    left: calc(406px + var(--frame-x));
    top: calc(50% + var(--frame-y));
    width: var(--frame-w);
    transform: translate(-50%, -50%);
    z-index: 1;
  }
  #frame {
    width: 100%;
    height: auto;
    display: block;
  }
  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
  }
  .layer.on { opacity: 1; }

  #screen {
    /* logical canvas is 256x144, shown scaled up; children are laid out
       in native screen pixels. Anchored to the center of #device in px,
       same as #stack, so the frame and the screen never drift apart */
    position: absolute;
    left: 406px; /* screen left edge = 406 - 256 = 150px from the window edge */
    top: 50%;
    z-index: 0; /* behind the frame, visible through the LCD window */
    transform: translate(-50%, -50%) scale(2);
    width: 256px;
    height: 144px;
    background: #fff;
    image-rendering: pixelated;
    overflow: hidden;
  }
  #S_scene {
    position: absolute;
    inset: 0;
    image-rendering: pixelated;
  }
  #S_rect {
    position: absolute;
    left: 214px;
    top: 6px;
    width: 34px;
    height: 11px;
    background: #000;
  }
  #S_rect_top, #S_rect_bottom {
    position: absolute;
    left: 215px;
    width: 32px;
    height: 1px;
    background: #000;
  }
  #S_rect_top { top: 5px; }
  #S_rect_bottom { top: 17px; }
  /* on the black plate the fill turns white and the digits invert */
  #S_rect.inv, #S_rect_top.inv, #S_rect_bottom.inv { background: #fff; }
  #S_pct_black.inv { color: #fff; }
  #S_pct_white.inv { color: #000; }
  .pct-layer {
    position: absolute;
    inset: 0;
    font-family: "HaxrCorp4090", monospace;
    font-size: 16px;
    line-height: 1;
    color: #000;
    -webkit-font-smoothing: none;
    font-smooth: never;
  }
  .pct-layer span {
    position: absolute;
    white-space: nowrap;
  }
  #S_pct_white { color: #fff; }
  #S_power_off {
    position: absolute;
    inset: 0;
  }
  #screen #S_power_off_icon {
    position: absolute;
    left: 4px;
    top: 3px;
    width: 14px;
    height: 14px;
    right: auto;
    bottom: auto;
  }
  #S_power_off_time {
    position: absolute;
    left: 22px;
    top: 4px;
    font-family: "HaxrCorp4090", monospace;
    font-size: 16px;
    line-height: 1;
    color: #AAAAAA;
    white-space: nowrap;
    -webkit-font-smoothing: none;
  }
  #S_discharge, #S_version {
    position: absolute;
    left: 5px;
    top: 4px;
    font-family: "HaxrCorp4090", monospace;
    font-size: 16px;
    line-height: 1;
    color: #AAAAAA;
    white-space: nowrap;
    -webkit-font-smoothing: none;
  }
  #S_discharge {
    left: 137px;
    color: #000;
  }
  #S_discharge.out {
    /* rides fully off the right edge when the charger connects */
    animation: discharge-out 0.2s steps(119, end) forwards;
  }
  @keyframes discharge-out {
    from { left: 137px; }
    to { left: 256px; }
  }
  #S_version {
    top: 109px;
  }
  .x-down {
    position: relative;
    top: 1px;
  }
  .no-pd {
    color: #696969;
  }
  #S_usbc1_status[hidden] { display: none; }
  #S_gpio {
    position: absolute;
    right: 5px;
    top: 23px;
  }
  /* the USB-C1 status line pushes GPIO down to the second slot */
  #S_usbc1_status:not([hidden]) ~ #S_gpio {
    top: 36px;
  }
  #S_gpio, #S_usbc1_status {
    font-family: "HaxrCorp4090", monospace;
    font-size: 16px;
    line-height: 1;
    color: #696969;
    white-space: nowrap;
    -webkit-font-smoothing: none;
  }
  #S_usbc1_status {
    position: absolute;
    right: 5px;
    top: 23px;
    display: flex;
    align-items: flex-start;
    gap: 4px;
    font-family: "HaxrCorp4090", monospace;
    font-size: 16px;
    line-height: 1;
    color: #696969;
    white-space: nowrap;
    -webkit-font-smoothing: none;
  }
  /* text in a box: 5px side / 3px vertical padding around the glyphs,
     pixel-rounded corners (steps 3-2-1) */
  .sbox {
    position: absolute;
    height: 11px;
    padding: 1px 5px 0;
    background: #AAAAAA;
    color: #fff;
    font-family: "HaxrCorp4090", monospace;
    font-size: 16px;
    line-height: 1;
    white-space: nowrap;
    -webkit-font-smoothing: none;
    clip-path: polygon(
      2px 0, calc(100% - 2px) 0,
      calc(100% - 2px) 1px, calc(100% - 1px) 1px,
      calc(100% - 1px) 2px, 100% 2px,
      100% calc(100% - 2px), calc(100% - 1px) calc(100% - 2px),
      calc(100% - 1px) calc(100% - 1px), calc(100% - 2px) calc(100% - 1px),
      calc(100% - 2px) 100%, 2px 100%,
      2px calc(100% - 1px), 1px calc(100% - 1px),
      1px calc(100% - 2px), 0 calc(100% - 2px),
      0 2px, 1px 2px, 1px 1px, 2px 1px
    );
  }
  .sbox > span {
    position: relative;
    top: -3px;
  }
  .sbox.inline {
    position: relative;
    top: 2px;
  }
  #S_bg_group, #S_info_group {
    visibility: hidden;
  }
  #S_bg_group {
    /* one shift value drives the plate; v002 is pre-widened, so the
       wide (fractional percent) state is the unshifted image */
    --bg-shift: 0px;
    position: absolute;
    inset: 0;
  }
  /* at 100% the percent has no hundredths, the plate shrinks back */
  #S_bg_group.full { --bg-shift: 18px; }
  #S_bg_group.shift { --bg-shift: 43px; }
  #S_battery_bg {
    margin-left: var(--bg-shift);
    /* fixed size: the group narrows while its entrance animation runs,
       a 100% width would squeeze the image */
    width: 256px;
    height: 144px;
    right: auto;
  }
  #S_info_group {
    position: absolute;
    inset: 0;
  }
  #S_info_content {
    /* battery_info plate together with battery_stat; move this to move both.
       fixed 256px width: an inset-based width would squeeze the image */
    position: absolute;
    top: 0;
    left: 6px;
    width: 256px;
    height: 144px;
  }
  /* charging layout, power >= 10W (whole watts): 7px right of lowpow */
  #S_info_group:not(.shift) #S_info_content { left: -15px; }
  #S_info_group:not(.shift) #S_battery_info { left: -5px; }
  #S_info_group:not(.shift) #S_input_text { left: 90px; }
  /* charging layout, power < 10W (fractional watts, longer line) */
  #S_info_group.lowpow:not(.shift) #S_info_content { left: -23px; }
  #S_info_group.lowpow:not(.shift) #S_battery_info { left: -5px; }
  #S_info_group.lowpow:not(.shift) #S_input_text { left: 90px; }
  #S_info_group.lowpow:not(.shift) #S_until_full { left: 95px; }
  /* at 100% the bg plate shrinks back, the info plate follows */
  #S_info_group.full:not(.shift) #S_info_content { left: 3px; }
  /* output (discharging) layout */
  #S_info_group.shift #S_info_content { left: 39px; }
  #S_info_group.shift #S_battery_stat { left: 3px; }
  /* Output line staggered 5px left of the Left line, same as
     Charging vs Untill */
  #S_info_group.shift #S_input_text { left: 93px; }
  #S_battery_stat {
    position: absolute;
    inset: 0;
  }
  #S_input_text, #S_until_full {
    position: absolute;
    left: 98px;
    top: -1px;
    font-family: "HaxrCorp4090", monospace;
    font-size: 16px;
    line-height: 1;
    color: #000;
    white-space: nowrap;
    -webkit-font-smoothing: none;
  }
  #S_until_full {
    top: 10px;
  }
  /* the lone "Fully charged!" line is centered on the plate */
  #S_info_group:not(.shift) #S_input_text.fully {
    top: 4px;
    left: 100px;
  }
  #S_charge_pct {
    position: absolute;
    top: 3px;
    right: 44px; /* right edge at x = 212, right-aligned */
    font-family: "Born2bSporty", monospace;
    font-size: 16px;
    line-height: 1;
    color: #fff;
    white-space: nowrap;
    -webkit-font-smoothing: none;
  }
  #S_bg_group.in, #S_info_group.in {
    visibility: visible;
    /* animate `left` in 84 whole-pixel steps: unlike transform it is
       re-rendered on the pixel grid every step, so nothing blurs */
    animation: bg-slide 0.2s steps(84, end) forwards;
  }
  @keyframes bg-slide {
    from { left: 84px; }
    to { left: 0; }
  }
  #screen::after {
    /* orange backlight multiplied over the white screen and the UI layers */
    content: "";
    position: absolute;
    inset: 0;
    background: #FF8200;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 10;
  }
  #screen img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  .layer.on.blink {
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    0%, 49.99% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  #panel {
    flex: none;
    align-self: stretch; /* background runs the full viewport height */
    width: 380px;
    padding: 40px;
    margin-left: -42%;
    position: relative;
    z-index: 1;
    background: rgba(0, 0, 0, 0.8); /* dims the flipper frame when it overlaps */
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
  }

  .slider {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #141518;
    border-radius: 16px;
    padding: 18px 20px;
  }
  .slider .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .head-left {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .slider label {
    font-size: 14px;
    font-weight: 600;
  }
  .slider .value {
    font-size: 14px;
    font-weight: 500;
    color: #aaa;
    font-variant-numeric: tabular-nums;
    min-width: 56px;
    text-align: right;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 24px;
    background: transparent;
    cursor: pointer;
    --fill: 0%;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, #FF8200 var(--fill), #333 var(--fill));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    margin-top: -7px;
    border-radius: 50%;
    background: #fff;
  }
  input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 2px;
    background: #333;
  }
  input[type="range"]::-moz-range-progress {
    height: 4px;
    border-radius: 2px;
    background: #FF8200;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px;
    border: none;
    border-radius: 50%;
    background: #fff;
  }
  .slider .bounds {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 500;
    color: #777;
    margin-top: -4px;
  }
  .slider .track-wrap {
    position: relative;
  }
  .slider .limiter {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 3px;
    height: 22px;
    border-radius: 1.5px;
    background: #999;
    pointer-events: none;
  }
  .slider .limiter.hidden { display: none; }
  .slider .note {
    font-size: 12px;
    font-weight: 500;
    color: #777;
    margin-top: -4px;
  }

  .checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .checkbox input {
    -webkit-appearance: none;
    appearance: none;
    width: 38px;
    height: 22px;
    border-radius: 11px;
    background: #333;
    position: relative;
    cursor: pointer;
    transition: background 150ms ease;
    flex: none;
  }
  .checkbox input::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: left 150ms ease;
  }
  .checkbox input:checked { background: #FF8200; }
  .checkbox input:checked::after { left: 19px; }

  .seg-row {
    display: flex;
    gap: 12px;
  }
  .seg {
    display: flex;
    background: #2a2a2d;
    border-radius: 10px;
    padding: 3px;
  }
  .seg button {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #8a8a8e;
    background: transparent;
    border: none;
    border-radius: 8px;
    padding: 7px 16px;
    cursor: pointer;
  }
  .seg button.active {
    background: #FF8200;
    color: #fff;
  }

  #errorBtn, #copyBtn {
    align-self: stretch;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: #2a2a2d;
    border: 1px solid #4a4a4e;
    border-radius: 8px;
    padding: 9px 22px;
    cursor: pointer;
  }
  #errorBtn.active {
    background: #d02020;
    border-color: #d02020;
  }

  @media (max-width: 768px) {
    body {
      flex-direction: column;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }
    #device {
      flex: none;
      width: 100%;
      /* height is set by JS to fit the scaled device */
    }
    #panel {
      flex: 1;
      min-height: 0;
      align-self: stretch;
      width: 100%;
      margin-left: 0;
      padding: 12px 24px 20px;
      gap: 20px;
      background: transparent;
      justify-content: flex-start;
    }
    /* compact cards and controls */
    .slider {
      padding: 10px 16px 8px;
      gap: 4px;
      border-radius: 12px;
    }
    #panel { gap: 12px; }
    .slider .bounds { margin-top: -8px; }
    .slider .note { margin-top: 0; }
    .slider label, .slider .value { font-size: 13px; }
    .seg { padding: 2px; border-radius: 8px; }
    .seg button {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 6px;
    }
    #errorBtn, #copyBtn {
      font-size: 13px;
      padding: 8px 16px;
    }
    /* bigger touch targets */
    input[type="range"] {
      height: 40px;
      touch-action: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      width: 28px;
      height: 28px;
      margin-top: -12px;
    }
    input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
    }
  }
</style>
</head>
<body>

<div id="device">
  <div id="scene">
  <div id="stack">
    <img id="frame" src="img/flipper_frame_2048.webp" srcset="img/flipper_frame_2048.webp 2048w, img/flipper_frame_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="FlipperOne frame">
    <img class="layer" id="L_plug" src="img/plug_2048.webp" srcset="img/plug_2048.webp 2048w, img/plug_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_plug_yellow" src="img/plug_yellow_2048.webp" srcset="img/plug_yellow_2048.webp 2048w, img/plug_yellow_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_chg1" src="img/charging_1_2048.webp" srcset="img/charging_1_2048.webp 2048w, img/charging_1_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_chg2" src="img/charging_2_2048.webp" srcset="img/charging_2_2048.webp 2048w, img/charging_2_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_chg3" src="img/charging_3_2048.webp" srcset="img/charging_3_2048.webp 2048w, img/charging_3_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_chg4" src="img/charging_4_2048.webp" srcset="img/charging_4_2048.webp 2048w, img/charging_4_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_bat_center" src="img/battery_center_2048.webp" srcset="img/battery_center_2048.webp 2048w, img/battery_center_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_bat_outline" src="img/battery_outline_2048.webp" srcset="img/battery_outline_2048.webp 2048w, img/battery_outline_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer blink" id="L_bat_yellow" src="img/battery_yellow_2048.webp" srcset="img/battery_yellow_2048.webp 2048w, img/battery_yellow_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer blink" id="L_bat_red_out" src="img/battery_red_outline_2048.webp" srcset="img/battery_red_outline_2048.webp 2048w, img/battery_red_outline_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer blink" id="L_bat_red" src="img/battery_red_2048.webp" srcset="img/battery_red_2048.webp 2048w, img/battery_red_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_tick1" src="img/battery_tick_1_2048.webp" srcset="img/battery_tick_1_2048.webp 2048w, img/battery_tick_1_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_tick2" src="img/battery_tick_2_2048.webp" srcset="img/battery_tick_2_2048.webp 2048w, img/battery_tick_2_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_tick3" src="img/battery_tick_3_2048.webp" srcset="img/battery_tick_3_2048.webp 2048w, img/battery_tick_3_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_tick4" src="img/battery_tick_4_2048.webp" srcset="img/battery_tick_4_2048.webp 2048w, img/battery_tick_4_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_tick5" src="img/battery_tick_5_2048.webp" srcset="img/battery_tick_5_2048.webp 2048w, img/battery_tick_5_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_tick6" src="img/battery_tick_6_2048.webp" srcset="img/battery_tick_6_2048.webp 2048w, img/battery_tick_6_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
    <img class="layer" id="L_tick7" src="img/battery_tick_7_2048.webp" srcset="img/battery_tick_7_2048.webp 2048w, img/battery_tick_7_4096.webp 4096w" sizes="(max-width: 768px) 640px, 1777px" alt="">
  </div>
  <div id="screen">
    <canvas id="S_scene" width="256" height="144"></canvas>
    <div id="S_discharge">Discharge: 0.00W</div>
    <div id="S_info_group">
      <div id="S_info_content">
        <img id="S_battery_info" src="UI_F1_Screen/battery_info.png" alt="">
        <div id="S_battery_stat">
          <div id="S_input_text">Charging: 5V 2W</div>
          <div id="S_until_full">Full in: 2h 11m</div>
        </div>
      </div>
    </div>
    <div id="S_bg_group">
      <img id="S_battery_bg" src="UI_F1_Screen/battery_bg_v002.png" alt="">

<script>
(() => {
  "use strict";
  const PD_LIMIT = 15;
  const MAX_W = 36;
  // thumb diameter, px: larger on mobile for touch
  const THUMB = () => (window.innerWidth <= 768 ? 28 : 18);

  const usbc1 = document.getElementById("usbc1");
  const usbc1Value = document.getElementById("usbc1Value");
  const pdCheck = document.getElementById("pdCheck");
  const pdLimiter = document.getElementById("pdLimiter");
  const plugLayer = document.getElementById("L_plug");
  const plugYellowLayer = document.getElementById("L_plug_yellow");
  const chg1Layer = document.getElementById("L_chg1");
  const chg2Layer = document.getElementById("L_chg2");
  const chg3Layer = document.getElementById("L_chg3");
  const chg4Layer = document.getElementById("L_chg4");
  const batCenterLayer = document.getElementById("L_bat_center");
  const batOutlineLayer = document.getElementById("L_bat_outline");
  const batYellowLayer = document.getElementById("L_bat_yellow");
  const batRedOutLayer = document.getElementById("L_bat_red_out");
  const batRedLayer = document.getElementById("L_bat_red");

  let errorState = false;

  // ---------- underwater parallax scene (dolphin_animation/MOTION_SPEC.md) ----------
  // charging pulls the sea left (36W -> -100 px/s), discharging pushes it
  // right (60W battery draw -> +100 px/s); set from updateUsage
  let seaSpeed = 0;
  const seaCanvas = document.getElementById("S_scene");
  const seaCtx = seaCanvas.getContext("2d");
  seaCtx.imageSmoothingEnabled = false;

  const seaImg = (n) => {
    const i = new Image();
    i.src = window.SCREEN_ASSETS[n];
    return i;
  };
  // draw order bottom to top
  const SEA_LAYERS = [
    { img: [seaImg("bg.png")], x: 0, y: 42, mult: 0.8, tile: 256, mirror: true },
    { img: [seaImg("ship.png")], x: 99, y: 44, mult: 0.7, wrap: 73 },
    { img: [seaImg("fishr1.png"), seaImg("fishr2.png")], x: -35, y: 41, mult: 0.9, swim: 10, fps: 3, wrap: 35 },
    { img: [seaImg("fishl1.png"), seaImg("fishl2.png")], x: 256, y: 73, mult: 0.9, swim: -10, fps: 3, wrap: 35 },
    { img: [seaImg("ground.png")], x: 0, y: 99, mult: 0.8, tile: 256 },
    { img: [seaImg("watter_top.png")], x: 0, y: 27, mult: 0.8, tile: 256 },
    { img: [seaImg("foliage_1.png"), seaImg("foliage_2.png")], x: 0, y: 84, mult: 1.0, fps: 2, tile: 256 },
    { img: [seaImg("sleepd_1.png")], x: 71, y: 43, mult: 0, dolphin: true },
  ];
  SEA_LAYERS.forEach((l) => { l.off = 0; });

  let seaLast = performance.now();
  function seaFrame(now) {
    const dt = Math.min((now - seaLast) / 1000, 0.1);
    seaLast = now;
    const t = now / 1000;
    seaCtx.fillStyle = "#fff";
    seaCtx.fillRect(0, 0, 256, 144);
    for (const l of SEA_LAYERS) {
      l.off += (seaSpeed * l.mult + (l.swim || 0)) * dt;
      const img = l.img[l.fps ? Math.floor(t * l.fps) % l.img.length : 0];
      if (!img.complete || !img.naturalWidth) continue;
      const x = l.x + Math.round(l.off);
      if (l.dolphin) {
        // faces left while charging (flow to the right), right otherwise
        if (seaSpeed > 0) {
          seaCtx.save();
          seaCtx.translate(x + img.naturalWidth, l.y);
          seaCtx.scale(-1, 1);
          seaCtx.drawImage(img, 0, 0);
          seaCtx.restore();
        } else {
          seaCtx.drawImage(img, x, l.y);
        }
        continue;
      }
      if (l.tile) {
        const w = l.tile;
        for (let k = Math.floor(-x / w) - 1; x + k * w < 256; k++) {
          const tx = x + k * w;
          if (tx + w <= 0) continue;
          if (l.mirror && ((k % 2) + 2) % 2 === 1) {
            seaCtx.save();
            seaCtx.translate(tx + w, l.y);
            seaCtx.scale(-1, 1);
            seaCtx.drawImage(img, 0, 0);
            seaCtx.restore();
          } else {
            seaCtx.drawImage(img, tx, l.y);
          }
        }
      } else {
        // leaves one edge, comes back at the other
        const period = 256 + l.wrap;
        const dx = (((x + l.wrap) % period) + period) % period - l.wrap;
        seaCtx.drawImage(img, dx, l.y);
      }
    }
    requestAnimationFrame(seaFrame);
  }
  requestAnimationFrame(seaFrame);
  const tickLayers = [1, 2, 3, 4, 5, 6, 7].map(
    (i) => document.getElementById("L_tick" + i)
  );

  function placeLimiter(el, watts) {
    const frac = wToRaw(watts) / sliderMax();
    // thumb center travels within [thumb/2, width - thumb/2]
    const t = THUMB();
    el.style.left = `calc(${t / 2}px + ${frac} * (100% - ${t}px))`;
  }

  // last value set by the user directly; limits may push the slider
  // below it, but it is restored once the limit releases
  let desiredWatts = 0;

  function currentLimit() {
    return pdCheck.checked ? MAX_W : PD_LIMIT;
  }

  // in OUT mode the slider scale is piecewise: raw 0..100 maps to
  // 0.00..1.00W in hundredths (~5% of the track), the rest is whole
  // watts, 54 raw units per watt
  const OUT_RAW_PER_W = 54;
  function sliderMax() {
    return usbc1Dir === "out" ? 100 + 35 * OUT_RAW_PER_W : 36;
  }
  function rawToW(raw) {
    if (usbc1Dir !== "out") return raw;
    if (raw <= 100) return raw / 100;
    return 1 + Math.round((raw - 100) / OUT_RAW_PER_W);
  }
  function wToRaw(w) {
    if (usbc1Dir !== "out") return w;
    if (w <= 1) return Math.round(w * 100);
    return 100 + Math.round(w - 1) * OUT_RAW_PER_W;
  }
  function formatW(w) {
    return parseFloat(w.toFixed(2)) + "W";
  }

  function updateUsbc1() {
    usbc1.max = sliderMax();
    const shownW = Math.min(desiredWatts, currentLimit());
    usbc1.value = wToRaw(shownW);
    usbc1Value.textContent = formatW(shownW);
    const pct = (usbc1.value - usbc1.min) / (usbc1.max - usbc1.min) * 100;
    usbc1.style.setProperty("--fill", pct + "%");
    // plug and chevrons indicate incoming power only, never in OUT mode
    const watts = usbc1Dir === "in" ? +usbc1.value : 0;
    plugLayer.classList.toggle("on", watts > 0 && pdCheck.checked);
    plugYellowLayer.classList.toggle("on", watts > 0 && !pdCheck.checked);
    // an idle full battery shows the plug only; with power usage the
    // energy flows through, so the chevrons are back
    const chevronsOn =
      !errorState && (+charge.value < 100 || +usage.value > 0);
    chg1Layer.classList.toggle("on", chevronsOn && watts > 0);
    chg2Layer.classList.toggle("on", chevronsOn && watts > 7.5);
    chg3Layer.classList.toggle("on", chevronsOn && watts > 15);
    chg4Layer.classList.toggle("on", chevronsOn && watts > 27);
    updateUsage();
  }

  function updateLimiter() {
    pdLimiter.classList.toggle("hidden", pdCheck.checked);
    placeLimiter(pdLimiter, PD_LIMIT);
  }

  const charge = document.getElementById("charge");
  const chargeValue = document.getElementById("chargeValue");
  const sRect = document.getElementById("S_rect");
  const sRectTop = document.getElementById("S_rect_top");
  const sRectBottom = document.getElementById("S_rect_bottom");
  const pctWhiteLayer = document.getElementById("S_pct_white");
  const dischargeEl = document.getElementById("S_discharge");
  const sBatteryCell = document.getElementById("S_battery_cell");
  const sChargingSpark = document.getElementById("S_charging_spark");
  const sBgGroup = document.getElementById("S_bg_group");
  const sInfoGroup = document.getElementById("S_info_group");
  const sInputText = document.getElementById("S_input_text");
  const sUntilFull = document.getElementById("S_until_full");
  const powerOffEl = document.getElementById("S_power_off");
  const powerOffTimeEl = document.getElementById("S_power_off_time");
  const BATTERY_WH = 7.2 * 3.7; // 7200 mAh at 3.7V nominal = 26.64 Wh
  const sChargePct = document.getElementById("S_charge_pct");
  const sUsbc1Status = document.getElementById("S_usbc1_status");
  let wasActive = false; // charging or discharging UI is on
  let plateShown = false; // plate contents appear only after it slid in
  sBgGroup.addEventListener("animationend", () => {
    plateShown = true;
    updateUsbc1();
  });
  const pctLayers = [
    document.getElementById("S_pct_black"),
    document.getElementById("S_pct_white"),
  ];
  const pctSpans = [
    document.querySelector("#S_pct_black span"),
    document.querySelector("#S_pct_white span"),
  ];

  // battery fill geometry on the device screen, px
  const BATT_X = 214, BATT_Y_TOP = 5, BATT_Y_BOTTOM = 18, BATT_W = 34;

  function updateCharge() {
    chargeValue.textContent = parseFloat((+charge.value).toFixed(2)) + "%";
    const pct = (charge.value - charge.min) / (charge.max - charge.min) * 100;
    charge.style.setProperty("--fill", pct + "%");
    // battery fill on the device screen: 34px = 100%, whole pixels;
    // top/bottom rows are 1px inset on each side for rounded pixel corners
    const fillW = Math.ceil(+charge.value / 100 * 34);
    sRect.style.width = fillW + "px";
    // caps cover the middle 32 columns (x 215..246) of the 34px rect:
    // their right edge follows the fill, clipped 1px short of each end
    const capW = Math.min(Math.max(fillW - 1, 0), 32);
    sRectTop.style.width = capW + "px";
    sRectBottom.style.width = capW + "px";
    positionPctDigits();
    updateLimiter();
    updateUsbc1();
  }

  // percent number centered in the battery: black copy over the empty
  // part, white copy clipped to the black fill, so it is always readable.
  // must run while the digits are visible: offsetWidth of a hidden
  // element is 0 and the centering breaks
  function positionPctDigits() {
    const fillW = Math.ceil(+charge.value / 100 * 34);
    // digits inside the battery stay whole
    pctSpans.forEach((s) => { s.textContent = Math.round(+charge.value); });
    // a hidden layer measures as 0 wide: unhide just for the measurement
    const wasHidden = pctLayers[0].hidden;
    if (wasHidden) pctLayers.forEach((l) => { l.hidden = false; });
    const textW = pctSpans[0].offsetWidth;
    if (wasHidden) pctLayers.forEach((l) => { l.hidden = true; });
    const textX = BATT_X + Math.round((BATT_W - textW) / 2);
    pctSpans.forEach((s) => {
      s.style.left = textX + "px";
      s.style.top = "4px";
    });
    pctWhiteLayer.style.clipPath =
      `inset(${BATT_Y_TOP}px ${256 - (BATT_X + fillW)}px ${144 - BATT_Y_BOTTOM}px ${BATT_X}px)`;
  }

  // threshold above which the battery is triggered; fixed
  const baseConsumptionW = 0.3;

  const usage = document.getElementById("usage");
  const usageValue = document.getElementById("usageValue");

  function updateUsage() {
    usageValue.textContent = (+usage.value).toFixed(2) + "W";
    const pct = (usage.value - usage.min) / (usage.max - usage.min) * 100;
    usage.style.setProperty("--fill", pct + "%");
    // battery discharge indication: the battery covers what the USB input
    // does not, triggered above the threshold.
    // ticks 1-4 stack; above 8W the pre-rendered 5/6/7 replace them
    // in OUT mode the port powers an external load: nothing comes in,
    // and its watts simply add to the system consumption
    const rawWatts = rawToW(+usbc1.value);
    const watts = usbc1Dir === "in" ? rawWatts : 0;
    const usageW = +usage.value + (usbc1Dir === "out" ? rawWatts : 0);
    const full = +charge.value === 100;
    // USB-C1 status line, right-aligned
    const portVolts = rawWatts <= 15 ? 5 : rawWatts <= 27 ? 9 : 12;
    sUsbc1Status.hidden = rawWatts === 0;
    sUsbc1Status.innerHTML =
      `<span>USB-C1 Power ${usbc1Dir === "in" ? "In" : "Out"}: ` +
      `${pdCheck.checked ? "PD Ver2" : '<span class="no-pd"><span class="x-down">×</span>PD</span>'}</span>` +
      `<span>${portVolts}V/${formatW(rawWatts)}</span>`;
    // actually charging: plugged in and the input covers consumption;
    // the error state kills all charging UI
    const charging = watts > 0 && usageW <= watts && !errorState;
    // the base consumption threshold only applies when running on battery;
    // with a cable plugged in any deficit counts as battery draw
    const excess = usageW - watts - (watts > 0 ? 0 : baseConsumptionW);
    // battery draining above the threshold shows its own info UI;
    // unlike charging it keeps working in the error state
    const discharging = excess > 0;
    const active = charging || discharging;
    // screen battery icon: idle by default, empty cell while charging;
    // while charging the percent digits give way to the spark, while
    // discharging they stay in place
    sBatteryCell.src = active
      ? "UI_F1_Screen/battery_cell_empty.png"
      : "UI_F1_Screen/battery_idle.png";
    // on the black plate the fill goes white and the digits invert
    [sRect, sRectTop, sRectBottom, pctLayers[0], pctLayers[1]]
      .forEach((el) => el.classList.toggle("inv", active));
    // no spark on a full battery
    sChargingSpark.hidden = !charging || full;
    const pctBecameVisible = pctLayers[0].hidden && !charging;
    pctLayers.forEach((l) => { l.hidden = charging; });
    if (pctBecameVisible) positionPctDigits();
    // on the bg plate: charge percent when charging, output icon otherwise
    sChargePct.hidden = !(charging && plateShown);
    // while charging the percent shows hundredths, e.g. 38.00%;
    // a full battery is plain 100%
    sChargePct.textContent =
      full ? "100%" : (+charge.value).toFixed(2) + "%";
    sBgGroup.classList.toggle("shift", discharging);
    sBgGroup.classList.toggle("full", full);
    sInfoGroup.classList.toggle("full", full);
    // sea speed: charging -> right (36W = +100), discharging -> left
    // (60W battery draw = -100). anything slower makes the pixels
    // crawl, so 30 px/s is the floor
    const SEA_MIN = 30;
    if (charging && !full && watts > usageW) {
      seaSpeed = Math.max(Math.min((watts - usageW) / 36, 1) * 100, SEA_MIN);
    } else if (discharging) {
      seaSpeed = -Math.max(Math.min(excess / 60, 1) * 100, SEA_MIN);
    } else {
      seaSpeed = 0;
    }
    sInfoGroup.classList.toggle("shift", discharging);
    // info strip lines
    if (discharging) {
      // discharging is plain discharging, even at 100%
      const shownOut = usageW > 9
        ? Math.round(usageW)
        : parseFloat(usageW.toFixed(2));
      sInputText.textContent = `Output: ${shownOut}W`;
      sInputText.classList.remove("fully");
      // time until empty, from the power the battery actually delivers
      const drain = usageW - watts;
      const hoursLeft = (charge.value / 100) * BATTERY_WH / drain;
      const totalMin = Math.ceil(hoursLeft * 60);
      const h = Math.floor(totalMin / 60);
      sUntilFull.textContent = h > 48
        ? "Left: > 48h"
        : `Left: ${h > 0 ? h + "h " : ""}${totalMin % 60}m`;
    } else {
      const volts = watts <= 15 ? 5 : watts <= 27 ? 9 : 12;
      // the battery only receives what the system does not consume;
      // above 9W the fraction is noise, show whole watts
      const intoBattery = Math.max(0, watts - usageW);
      const shownW = intoBattery > 9
        ? Math.round(intoBattery)
        : parseFloat(intoBattery.toFixed(2));
      sInputText.textContent = full ? "Fully charged!" : `Charging: ${volts}V ${shownW}W`;
      sInputText.classList.toggle("fully", full);
      // when the shown watts actually carry fractions the line is
      // longer, so the plate/text layout switches
      sInfoGroup.classList.toggle("lowpow", !Number.isInteger(shownW));
      if (full) {
        sUntilFull.textContent = "";
      } else if (intoBattery > 0) {
        const hoursLeft = (1 - charge.value / 100) * BATTERY_WH / intoBattery;
        const totalMin = Math.ceil(hoursLeft * 60);
        const h = Math.floor(totalMin / 60);
        sUntilFull.textContent = h >= 100
          ? "Full in: ∞"
          : `Full in: ${h > 0 ? h + "h " : ""}${totalMin % 60}m`;
      } else {
        sUntilFull.textContent = "Full in: ∞";
      }
    }
    // the Power OFF countdown is hidden while the info UI is up
    powerOffEl.hidden = active;
    if (active && !wasActive) {
      plateShown = false;
      sBgGroup.classList.remove("in");
      sInfoGroup.classList.remove("in");
      dischargeEl.classList.remove("out");
      void sBgGroup.offsetWidth; // restart the animations
      sBgGroup.classList.add("in");
      sInfoGroup.classList.add("in");
      dischargeEl.classList.add("out");
    } else if (!active) {
      plateShown = false;
      sBgGroup.classList.remove("in");
      sInfoGroup.classList.remove("in");
      dischargeEl.classList.remove("out");
    }
    wasActive = active;
    // critically low charge -> blinking red outline, unless charging
    const critical = +charge.value < 5 && !charging;
    // plugged in but the input does not cover consumption -> whole icon yellow
    const yellow = watts > 0 && usageW > watts;
    // what actually flows out of the battery
    dischargeEl.textContent =
      "Discharge: " + Math.max(0, usageW - watts).toFixed(2) + "W";
    batRedLayer.classList.toggle("on", errorState);
    batRedOutLayer.classList.toggle("on", critical && !errorState);
    batYellowLayer.classList.toggle("on", yellow && !critical && !errorState);
    // the green outline accompanies the center bolt whenever it is lit
    const centerOn = watts > 0 && !full && !yellow && !critical && !errorState;
    batCenterLayer.classList.toggle("on", centerOn);
    batOutlineLayer.classList.toggle("on",
      centerOn || (excess > 0 && !yellow && !critical && !errorState));
    const ticksOn = !errorState;
    tickLayers[0].classList.toggle("on", ticksOn && excess > 0 && excess <= 8);
    tickLayers[1].classList.toggle("on", ticksOn && excess > 2 && excess <= 8);
    tickLayers[2].classList.toggle("on", ticksOn && excess > 4 && excess <= 8);
    tickLayers[3].classList.toggle("on", ticksOn && excess > 6 && excess <= 8);
    tickLayers[4].classList.toggle("on", ticksOn && excess > 8 && excess <= 12);
    tickLayers[5].classList.toggle("on", ticksOn && excess > 12 && excess <= 24);
    tickLayers[6].classList.toggle("on", ticksOn && excess > 24);
  }

  usage.addEventListener("input", updateUsbc1);

  // USB-C1 direction and PD segmented switches
  let usbc1Dir = "in";
  function wireSeg(id, onChange) {
    const seg = document.getElementById(id);
    seg.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        seg.querySelectorAll("button").forEach((b) =>
          b.classList.toggle("active", b === btn));
        onChange(btn.dataset.value);
      });
    });
  }
  wireSeg("dirSeg", (v) => {
    usbc1Dir = v;
    // IN mode has no fractional watts
    if (v === "in") desiredWatts = Math.round(desiredWatts);
    updateLimiter();
    updateUsbc1();
  });
  wireSeg("pdSeg", (v) => {
    pdCheck.checked = v === "on";
    pdCheck.dispatchEvent(new Event("change"));
  });

  const errorBtn = document.getElementById("errorBtn");
  errorBtn.addEventListener("click", () => {
    errorState = !errorState;
    errorBtn.classList.toggle("active", errorState);
    updateUsbc1();
  });
  usbc1.addEventListener("input", () => {
    desiredWatts = Math.min(rawToW(+usbc1.value), currentLimit());
    updateUsbc1();
  });
  charge.addEventListener("input", updateCharge);
  pdCheck.addEventListener("change", () => {
    updateLimiter();
    updateUsbc1();
  });
  // snap the vertical anchor to a whole pixel, otherwise a 50% top on an
  // odd-height window puts the whole screen on a half pixel and blurs it.
  // on mobile the whole scene is scaled to the viewport width instead,
  // with the device pinned to the top
  const device = document.getElementById("device");
  const scene = document.getElementById("scene");
  const screenEl = document.getElementById("screen");
  const stackEl = document.getElementById("stack");
  // device visual bounds in scene coordinates (anchor cy = 470)
  const SCENE = { cy: 470, top: 200, bottom: 803, right: 1127 };
  function snapAnchor() {
    let cy;
    if (window.innerWidth <= 768) {
      const k = device.clientWidth / SCENE.right;
      const pad = 16;
      device.style.height =
        Math.round((SCENE.bottom - SCENE.top) * k + pad * 2) + "px";
      scene.style.transform =
        `scale(${k}) translate(0px, ${pad / k - SCENE.top}px)`;
      cy = SCENE.cy;
    } else {
      device.style.height = "";
      scene.style.transform = "";
      cy = Math.round(device.clientHeight / 2);
    }
    screenEl.style.top = cy + "px";
    stackEl.style.top = `calc(${cy}px + var(--frame-y))`;
  }
  window.addEventListener("resize", () => {
    snapAnchor();
    // thumb size differs between mobile and desktop
    updateLimiter();
  });
  snapAnchor();

  updateLimiter();
  updateUsbc1();
  updateCharge();
  updateUsage();
  // re-measure the percent text once the pixel font is loaded
  document.fonts.ready.then(updateCharge);

  // ---------- copy the screen as a white 256x144 reference PNG ----------
  const copyBtn = document.getElementById("copyBtn");
  const refImages = {};

  function refImage(src) {
    const name = decodeURIComponent(src).split("/").pop();
    if (!refImages[name]) {
      const im = new Image();
      im.src = window.SCREEN_ASSETS[name];
      refImages[name] = im;
    }
    return refImages[name];
  }

  function isShown(el) {
    if (el.hidden) return false;
    const cs = getComputedStyle(el);
    return cs.display !== "none" && cs.visibility !== "hidden";
  }

  function parseColor(c) {
    const m = c.match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [0, 0, 0];
  }

  async function renderReference() {
    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 144;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, 256, 144);

    const sr = screenEl.getBoundingClientRect();
    const k = sr.width / 256;
    const rel = (r) => ({
      x: Math.round((r.left - sr.left) / k),
      y: Math.round((r.top - sr.top) / k),
      w: Math.round(r.width / k),
      h: Math.round(r.height / k),
    });

    // text is rasterized on a side canvas and binarized: no antialiasing
    function drawPixelText(text, x, baselineY, cssColor, font) {
      const tmp = document.createElement("canvas");
      tmp.width = 256;
      tmp.height = 144;
      const tc = tmp.getContext("2d");
      tc.font = font;
      tc.fillText(text, x, baselineY);
      const img = tc.getImageData(0, 0, 256, 144);
      const [cr, cg, cb] = parseColor(cssColor);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] >= 128) {
          d[i] = cr; d[i + 1] = cg; d[i + 2] = cb; d[i + 3] = 255;
        } else {
          d[i + 3] = 0;
        }
      }
      tc.putImageData(img, 0, 0);
      ctx.drawImage(tmp, 0, 0);
    }

    // draws every text node of an element, honoring per-span color/offset
    function drawTextNodes(el) {
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      for (let n = walker.nextNode(); n; n = walker.nextNode()) {
        if (!n.textContent) continue;
        const range = document.createRange();
        range.selectNode(n);
        const r = rel(range.getBoundingClientRect());
        const cs = getComputedStyle(n.parentElement);
        const ascent = cs.fontFamily.includes("Born2bSporty") ? 13 : 9;
        drawPixelText(n.textContent, r.x, r.y + ascent, cs.color,
          `${cs.fontSize} ${cs.fontFamily}`);
      }
    }

    async function paint(el) {
      if (!isShown(el)) return;
      if (el.tagName === "CANVAS") {
        const r = rel(el.getBoundingClientRect());
        ctx.drawImage(el, r.x, r.y, r.w, r.h);
        return;
      }
      if (el.tagName === "IMG") {
        const im = refImage(el.src);
        await im.decode();
        const r = rel(el.getBoundingClientRect());
        ctx.drawImage(im, r.x, r.y, r.w, r.h);
        return;
      }
      if (["S_rect", "S_rect_top", "S_rect_bottom"].includes(el.id)) {
        const r = rel(el.getBoundingClientRect());
        ctx.fillStyle = getComputedStyle(el).backgroundColor;
        ctx.fillRect(r.x, r.y, r.w, r.h);
        return;
      }
      if (["S_info_group", "S_info_content", "S_battery_stat", "S_power_off", "S_usbc1_status", "S_bg_group"].includes(el.id)) {
        for (const c of el.children) await paint(c);
        return;
      }
      if (el.classList.contains("sbox")) {
        const r = rel(el.getBoundingClientRect());
        ctx.fillStyle = getComputedStyle(el).backgroundColor;
        // pixel-rounded box, corner steps 2-1
        ctx.beginPath();
        const p = [
          [2, 0], [r.w - 2, 0], [r.w - 2, 1], [r.w - 1, 1], [r.w - 1, 2],
          [r.w, 2], [r.w, r.h - 2], [r.w - 1, r.h - 2],
          [r.w - 1, r.h - 1], [r.w - 2, r.h - 1], [r.w - 2, r.h], [2, r.h],
          [2, r.h - 1], [1, r.h - 1], [1, r.h - 2], [0, r.h - 2],
          [0, 2], [1, 2], [1, 1], [2, 1],
        ];
        p.forEach(([px2, py], i) =>
          i ? ctx.lineTo(r.x + px2, r.y + py) : ctx.moveTo(r.x + px2, r.y + py));
        ctx.closePath();
        ctx.fill();
        drawTextNodes(el);
        return;
      }
      if (el.classList.contains("pct-layer")) {
        const white = el.id === "S_pct_white";
        if (white) {
          const rs = rel(sRect.getBoundingClientRect());
          ctx.save();
          ctx.beginPath();
          ctx.rect(rs.x, rs.y - 1, rs.w, rs.h + 2);
          ctx.clip();
        }
        drawTextNodes(el);
        if (white) ctx.restore();
        return;
      }
      drawTextNodes(el);
    }

    for (const el of screenEl.children) await paint(el);
    return canvas;
  }

  copyBtn.addEventListener("click", async () => {
    try {
      await Promise.all([
          document.fonts.load('16px "HaxrCorp4090"'),
          document.fonts.load('16px "Born2bSporty"'),
        ]);
      const canvas = await renderReference();
      const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      copyBtn.textContent = "Copied!";
    } catch (e) {
      copyBtn.textContent = "Copy failed: " + e.message;
    }
    setTimeout(() => { copyBtn.textContent = "Copy UI as PNG reference"; }, 1500);
  });

  // preset state via URL params (testing/screenshots),
  // e.g. ?in=36&dir=in&pd=1&chg=38&use=0.89&err=0
  const qp = new URLSearchParams(location.search);
  if (qp.size) {
    if (qp.has("chg")) charge.value = qp.get("chg");
    if (qp.has("use")) usage.value = qp.get("use");
    if (qp.has("in")) desiredWatts = +qp.get("in");
    if (qp.has("dir")) {
      usbc1Dir = qp.get("dir");
      document.querySelectorAll("#dirSeg button").forEach((b) =>
        b.classList.toggle("active", b.dataset.value === usbc1Dir));
    }
    if (qp.has("pd")) {
      pdCheck.checked = qp.get("pd") === "1";
      document.querySelectorAll("#pdSeg button").forEach((b) =>
        b.classList.toggle("active", (b.dataset.value === "on") === pdCheck.checked));
    }
    if (qp.has("err")) {
      errorState = qp.get("err") === "1";
      errorBtn.classList.toggle("active", errorState);
    }
    updateLimiter();
    updateCharge();
    // headless helper: replace the page with the reference canvas
    if (qp.has("refshot")) {
      setTimeout(async () => {
        await Promise.all([
          document.fonts.load('16px "HaxrCorp4090"'),
          document.fonts.load('16px "Born2bSporty"'),
        ]);
        // entrance animations may not have finished: force the end state
        plateShown = true;
        updateUsbc1();
        document.getAnimations().forEach((a) => a.finish());
        const c = await renderReference();
        document.body.replaceChildren(c);
        document.body.style.cssText =
          "display:block;background:#fff;margin:0;overflow:hidden;min-height:0";
        c.style.display = "block";
      }, 800);
    }
  }

  // "Power OFF" countdown
  let powerOffSeconds = 2 * 3600 + 10 * 60 + 10;
  function renderPowerOff() {
    const h = Math.floor(powerOffSeconds / 3600);
    const m = Math.floor((powerOffSeconds % 3600) / 60);
    const s = powerOffSeconds % 60;
    // single leading unit only: "in 2h", "in 9m", "in 30s"
    powerOffTimeEl.textContent =
      "Power OFF in " + (h > 0 ? h + "h" : m > 0 ? m + "m" : s + "s");
  }
  setInterval(() => {
    if (powerOffSeconds > 0) {
      powerOffSeconds--;
      renderPowerOff();
    }
  }, 1000);
  renderPowerOff();
})();
</script>
</body>
</html>
